<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="920" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e1a" />
      <stop offset="100%" stop-color="#141829" />
    </linearGradient>

    <!-- Neon Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe5e3b" />
      <stop offset="50%" stop-color="#c71a5e" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #00e5ff;
    }
    .label-text {
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 11px;
      fill: #fe5e3b;
      font-weight: bold;
    }
    .val-text {
      font-family: "SF Pro Text", -apple-system, sans-serif;
      font-size: 12px;
      fill: #fff6e0;
    }
    .accent-cyan {
      fill: #00e5ff;
      filter: url(#glow-cyan);
    }
    .glow-border {
      stroke: url(#border-grad);
      stroke-width: 1.5;
      stroke-opacity: 0.8;
    }
    .radar-outer {
      stroke: #00e5ff;
      stroke-width: 1;
      stroke-opacity: 0.4;
      stroke-dasharray: 4 4;
      animation: rotate-radar 25s linear infinite;
      transform-origin: 820px 80px;
    }
    .radar-beam {
      stroke: url(#border-grad);
      stroke-width: 1.5;
      animation: rotate-radar 6s linear infinite;
      transform-origin: 820px 80px;
      filter: url(#glow-orange);
    }
    .radar-sweep {
      fill: url(#border-grad);
      fill-opacity: 0.05;
      animation: rotate-radar 6s linear infinite;
      transform-origin: 820px 80px;
    }
    @keyframes rotate-radar {
      100% { transform: rotate(360deg); }
    }
    .blinker {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      from, to { fill: transparent }
      50% { fill: #00e5ff }
    }
    .pulse-glow {
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; filter: drop-shadow(0 0 4px #fe5e3b); }
    }
  </style>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="916" height="156" rx="12" fill="url(#bg-grad)" class="glow-border" />

  <!-- Outer visual tech corner markings -->
  <path d="M 12 12 L 28 12 M 12 12 L 12 28" stroke="#fe5e3b" stroke-width="2" fill="none" />
  <path d="M 908 12 L 892 12 M 908 12 L 908 28" stroke="#00e5ff" stroke-width="2" fill="none" />
  <path d="M 12 148 L 28 148 M 12 148 L 12 132" stroke="#00e5ff" stroke-width="2" fill="none" />
  <path d="M 908 148 L 892 148 M 908 148 L 908 132" stroke="#fe5e3b" stroke-width="2" fill="none" />

  <!-- Window Controls Mac-Style (Sleek Details) -->
  <circle cx="30" cy="28" r="5" fill="#ff5f56" />
  <circle cx="45" cy="28" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="28" r="5" fill="#27c93f" />

  <!-- Console Header Text -->
  <text x="85" y="32" class="title-text">sanchit@system:~$ diagnostics --status</text>
  <rect x="365" y="20" width="8" height="14" fill="#00e5ff" class="blinker" />

  <!-- Horizontal Splitter Line -->
  <line x1="20" y1="46" x2="720" y2="46" stroke="#252b47" stroke-width="1" />

  <!-- Main Information Block -->
  <g transform="translate(30, 60)">
    
    <!-- Row 1: System Mode -->
    <text x="0" y="12" class="label-text">⚡ SYSTEM_MODE:</text>
    <text x="120" y="12" class="val-text" font-weight="bold" fill="#fff6e0">
      BUILD_AUTOMATE_REBUILD &lt;<tspan fill="#fe5e3b" class="pulse-glow">Online</tspan>&gt;
    </text>

    <!-- Row 2: Core Vector -->
    <text x="0" y="38" class="label-text">🧬 CORE_VECTOR:</text>
    <text x="120" y="38" class="val-text" font-weight="bold" fill="#fff6e0">
      Deep Learning &amp; Automated Systems
    </text>

    <!-- Row 3: Stack Metrics -->
    <text x="0" y="64" class="label-text">🛠️ STACK_MATRIX:</text>
    <text x="120" y="64" class="val-text" fill="#a0aec0">
      Python • FastAPI • Next.js • React • AWS • Docker • Supabase
    </text>

    <!-- Row 4: Operational Nodes -->
    <text x="0" y="90" class="label-text">📡 ACTIVE_NODES:</text>
    
    <rect x="120" y="78" width="105" height="18" rx="4" fill="#161a2e" stroke="#252b47" stroke-width="1" />
    <circle cx="132" cy="87" r="3.5" fill="#39ff14" />
    <text x="144" y="91" class="title-text" font-size="9" fill="#00e5ff">NimbusKart</text>

    <rect x="235" y="78" width="90" height="18" rx="4" fill="#161a2e" stroke="#252b47" stroke-width="1" />
    <circle cx="247" cy="87" r="3.5" fill="#39ff14" />
    <text x="259" y="91" class="title-text" font-size="9" fill="#00e5ff">FaceSort</text>

    <rect x="335" y="78" width="95" height="18" rx="4" fill="#161a2e" stroke="#252b47" stroke-width="1" />
    <circle cx="347" cy="87" r="3.5" fill="#39ff14" />
    <text x="359" y="91" class="title-text" font-size="9" fill="#00e5ff">TradingBot</text>
  </g>

  <!-- Vertical Splitter Line for Radar Section -->
  <line x1="730" y1="20" x2="730" y2="140" stroke="#252b47" stroke-width="1" />

  <!-- DYNAMIC RADAR GRAPHICS (WOW FACTOR) -->
  <g transform="translate(0, 0)">
    <!-- Radar Grids -->
    <circle cx="820" cy="80" r="55" fill="none" stroke="#252b47" stroke-width="1" />
    <circle cx="820" cy="80" r="35" fill="none" stroke="#252b47" stroke-width="1" />
    <circle cx="820" cy="80" r="15" fill="none" stroke="#252b47" stroke-width="1" />
    
    <!-- Crosshairs -->
    <line x1="755" y1="80" x2="885" y2="80" stroke="#252b47" stroke-width="1" />
    <line x1="820" y1="15" x2="820" y2="145" stroke="#252b47" stroke-width="1" />
    
    <!-- Animated sweep -->
    <path d="M 820 80 L 859 41 A 55 55 0 0 0 820 25 Z" class="radar-sweep" />
    <line x1="820" y1="80" x2="859" y2="41" class="radar-beam" />
    <circle cx="820" cy="80" r="55" fill="none" class="radar-outer" />
    
    <!-- Target blips -->
    <circle cx="800" cy="50" r="3.5" fill="#fe5e3b" class="pulse-glow" />
    <circle cx="850" cy="100" r="2.5" fill="#00e5ff" />
  </g>
</svg>
